<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <meta name="robots" content="noindex">
  <title>Clubs Deuce Mugger | Mug Finder</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CB">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="smoke"><i></i><i></i><i></i></div><div class="suits-bg"></div>
  <main class="wrap">
    <header class="topbar">
      <h1>Mug Finder <svg class="icon club-c"><use href="/img/sprite.svg#club"/></svg></h1>
      <div class="who" id="who"></div>
      <div class="actions">
        <a class="btn ghost small" href="/app/settings.html">Settings</a>
        <button class="btn ghost small" id="logout" type="button">Log out</button>
      </div>
    </header>

    <div class="alerts" id="alerts" aria-live="polite"></div>
    <p class="msg info" id="setup-note" hidden>Add your Torn API key in <a href="/app/settings.html">Settings</a> to start scanning.</p>

    <div class="panels">
      <section class="card panel">
        <span class="corner tl club-c"><svg class="icon"><use href="/img/sprite.svg#club"/></svg></span>
        <h2>Items to scan</h2>
        <div class="stack">
          <label class="check"><input type="checkbox" id="autoScan"> Auto scan every item whose cheapest listing and market value are at or above the minimum price</label>
          <label>Max items per scan <span class="hint">Most valuable first. The watchlist below is always included.</span>
            <input type="number" id="maxItems" inputmode="numeric" min="1" max="150" step="1"></label>
        </div>
        <h3 class="sub-h">Watchlist (always scanned)</h3>
        <form class="row" id="watch-form">
          <input type="number" id="watch-id" inputmode="numeric" min="1" step="1" placeholder="Item ID (e.g. 206)" aria-label="Item ID">
          <button class="btn small" type="submit">Add</button>
        </form>
        <div class="chips" id="chips"></div>
      </section>

      <section class="card panel">
        <span class="corner tl derse-c"><svg class="icon"><use href="/img/sprite.svg#diamond"/></svg></span>
        <h2>Filters</h2>
        <div class="stack">
          <div class="label">Minimum item price ($)
            <div class="slider-row"><input type="range" id="minPrice-r" min="0" max="1000"><input type="number" id="minPrice" inputmode="numeric" min="0" step="1" aria-label="Minimum item price"></div></div>
          <div class="label">Min battle stats (estimate)
            <div class="slider-row"><input type="range" id="minBs-r" min="0" max="1000"><input type="number" id="minBs" inputmode="numeric" min="0" step="1" aria-label="Minimum battle stats"></div></div>
          <div class="label">Max battle stats (estimate)
            <div class="slider-row"><input type="range" id="maxBs-r" min="0" max="1000"><input type="number" id="maxBs" inputmode="numeric" min="0" step="1" aria-label="Maximum battle stats"></div></div>
          <div class="label">Max fair fight
            <div class="slider-row"><input type="range" id="maxFf-r" min="1" max="3" step="0.01"><input type="number" id="maxFf" inputmode="decimal" min="1" max="3" step="0.01" aria-label="Maximum fair fight"></div></div>
          <label>Listing price within % of market value <span class="hint">Skips listings priced far from what the item really sells for. 0 turns this check off.</span>
            <input type="number" id="priceTol" inputmode="numeric" min="0" max="100" step="1"></label>
          <label>Max sellers to check <span class="hint">Highest value listings first</span>
            <input type="number" id="maxSellers" inputmode="numeric" min="1" max="500" step="1"></label>
        </div>
      </section>
    </div>

    <div class="scanbar">
      <button class="btn green" id="scan" type="button">Scan bazaars &clubs;</button>
      <button class="btn ghost" id="cancel" type="button" hidden>Stop</button>
      <span class="msg info" id="scan-msg" role="status" aria-live="polite"></span>
    </div>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>

    <div class="sortbar">
      <label>Sort by
        <select id="sort">
          <option value="stats">Battle stats</option>
          <option value="hospital">Hospital time</option>
          <option value="age">Account age</option>
          <option value="price">Price</option>
        </select>
      </label>
      <label>Order
        <select id="dir">
          <option value="asc">Ascending</option>
          <option value="desc">Descending</option>
        </select>
      </label>
    </div>

    <section class="results" id="results" aria-live="polite"></section>
  <p class="foot">Font: Fontstuck by KevinHilt, <a href="/fonts/LICENSE-fontstuck.txt">CC BY-SA 3.0</a></p>
  </main>
  <script src="/app/app.js"></script>
</body>
</html>
